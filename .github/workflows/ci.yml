name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.13'
      - name: Hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Dependency compatibility
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q src tests tests_live
      - name: Offline contracts (no Azure calls)
        run: python -m pytest -q
      - name: Current vulnerability advisories
        run: python -m pip_audit -r requirements-dev.txt --no-deps --disable-pip --vulnerability-service osv
      - name: Explicit real gate rejects missing authorization
        shell: bash
        run: |
          if VECTOR_SEARCH_LIVE_TEST= python -m pytest tests_live -q > live-gate.log 2>&1; then
            echo 'Explicit real gate unexpectedly accepted missing opt-in'
            exit 1
          fi
          grep -q 'requires VECTOR_SEARCH_LIVE_TEST=1; no network calls made' live-gate.log
